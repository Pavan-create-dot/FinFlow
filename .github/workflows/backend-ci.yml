name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6-jammy
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Lint Codebase
      run: npm run lint

    - name: Run Tests
      run: npm run test
      env:
        DATABASE_URL: mongodb://127.0.0.1:27017/finflow_test
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_ACCESS_SECRET: test_secret_access
        JWT_REFRESH_SECRET: test_secret_refresh
        GEMINI_API_KEY: test_key
        ENCRYPTION_SECRET: abcdefghijklmnopqrstuvwxyz123456
        PORT: 3000

    - name: Build Application
      run: npm run build

