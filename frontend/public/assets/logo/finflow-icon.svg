<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Rounded background square -->
  <rect width="48" height="48" rx="12" fill="#2563EB"/>
  <!-- Flow mark: three staggered bars suggesting upward trend / data flow -->
  <rect x="10" y="28" width="6" height="10" rx="2" fill="#ffffff" opacity="0.55"/>
  <rect x="21" y="20" width="6" height="18" rx="2" fill="#ffffff" opacity="0.80"/>
  <rect x="32" y="12" width="6" height="26" rx="2" fill="#ffffff"/>
  <!-- Teal accent dot in top-right of the middle bar -->
  <circle cx="24" cy="17" r="3" fill="#14B8A6"/>
</svg>
